<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Petualangan Matematika Online – Keliling Bangun Datar</title>
<style>
:root{--ink:#2b3a67;--blue:#7fb7ff;--sun:#ffd95e;--mint:#b5ead7;--pink:#ffc8dd;--lav:#d9c8ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px;color:var(--ink);
font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:linear-gradient(135deg,#e6f3ff,#fff6df 55%,#f1e7ff)}
#board{width:min(96vw,calc(100vh - 20px),880px);aspect-ratio:1;container-type:inline-size;display:grid;
grid-template:repeat(11,1fr)/repeat(11,1fr);gap:.5cqw;background:#fff;border:1.2cqw solid var(--blue);
border-radius:2.5cqw;padding:.8cqw;box-shadow:0 12px 32px rgba(60,100,180,.28)}
.t{position:relative;border-radius:1cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;
text-align:center;border:.25cqw solid rgba(43,58,103,.28);padding:.2cqw;line-height:1.05;min-width:0}
.t i{font-style:normal;font-size:3cqw}
.t b{font-size:1.1cqw;font-weight:800}
.tk{position:absolute;top:.1cqw;left:0;right:0;display:flex;justify-content:center}
.tk span{font-size:2cqw;line-height:1;background:#fff;border-radius:50%;box-shadow:0 0 0 .2cqw var(--ink);margin:0 -.1cqw}
#c{grid-area:2/2/11/11;border-radius:2cqw;padding:1.6cqw 2cqw;display:flex;flex-direction:column;align-items:center;
justify-content:space-between;text-align:center;position:relative;overflow:hidden;
background:radial-gradient(circle at 15% 15%,#fff3b8 0,transparent 35%),radial-gradient(circle at 88% 90%,#d8f5e8 0,transparent 40%),#f4faff}
#c h1{margin:0;font-size:4.6cqw;line-height:1;letter-spacing:.02em;color:#3c63c4;text-shadow:.3cqw .3cqw 0 var(--sun)}
#c h2{margin:.6cqw 0 0;font-size:2.4cqw;color:#e0813a}
.goal{font-size:1.3cqw;max-width:60cqw;background:#fff;border-radius:1.2cqw;padding:.8cqw 1.4cqw;border:.2cqw dashed var(--blue)}
.stage{font-size:6cqw;display:flex;gap:1.5cqw;align-items:center}
.stage span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
.stage span:nth-child(2n){animation-delay:.6s}.stage span:nth-child(3n){animation-delay:1.2s}
@keyframes bob{50%{transform:translateY(-1cqw)}}
.deco{font-size:3.4cqw;opacity:.9}
#score{display:flex;gap:1cqw;flex-wrap:wrap;justify-content:center}
.pl{background:#fff;border:.3cqw solid #cfe0ff;border-radius:1.2cqw;padding:.5cqw 1.2cqw;font-size:1.5cqw;font-weight:700;min-width:12cqw}
.pl.on{border-color:var(--ink);background:#fff6c9;transform:scale(1.06)}
.pl small{display:block;font-weight:600;opacity:.7;font-size:1.1cqw}
#ctl{display:flex;align-items:center;gap:2cqw}
#dice{font-size:8cqw;line-height:1;width:10cqw;height:10cqw;display:grid;place-items:center;background:#fff;border-radius:2cqw;
border:.4cqw solid var(--ink);box-shadow:0 .5cqw 0 var(--ink)}
button{font:inherit;cursor:pointer}
.btn{background:var(--ink);color:#fff;border:0;border-radius:1.6cqw;padding:1.2cqw 2.6cqw;font-size:2cqw;font-weight:800;box-shadow:0 .5cqw 0 #16224a}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.op button:focus-visible{outline:.4cqw solid #ff8a3d;outline-offset:.2cqw}
#msg{font-size:1.7cqw;font-weight:700;min-height:2.2cqw}
#ov{position:fixed;inset:0;background:rgba(30,45,90,.55);display:none;align-items:center;justify-content:center;padding:12px;z-index:9}
#ov.on{display:flex}
.box{background:#fff;border-radius:22px;padding:22px 26px;width:min(560px,100%);max-height:94vh;overflow:auto;border:5px solid var(--blue);text-align:center}
.box .hd{font-size:22px;font-weight:800}.box .pt{font-size:14px;opacity:.75;margin-bottom:8px}
.box h3{font-size:21px;margin:8px 0;line-height:1.3}
.op{display:grid;gap:9px;margin-top:12px}
.op button{background:#eef6ff;border:3px solid #bcd7ff;border-radius:14px;padding:11px;font-size:18px;font-weight:700;color:var(--ink)}
.op button:hover:not(:disabled){background:#dcecff}
.op .ok{background:#c9f2d9!important;border-color:#43b581!important}.op .no{background:#ffd3d3!important;border-color:#e66!important}
#fb{margin-top:12px;font-size:16px;line-height:1.4}
.fg{width:200px;max-width:70%}.fg text{font:700 14px sans-serif;fill:var(--ink)}
.setup input{font:inherit;padding:8px 10px;border:3px solid #bcd7ff;border-radius:10px;margin:4px;width:150px;color:var(--ink)}
.cnt button{font-size:20px;border:3px solid var(--blue);background:#fff;border-radius:12px;padding:6px 16px;margin:4px;font-weight:800;color:var(--ink)}
.cnt button.sel{background:var(--sun)}
@media(max-width:560px){.goal,.deco{display:none}}
@media(prefers-reduced-motion:reduce){.stage span{animation:none}}
</style>
<style>
.box .btn{font-size:18px;padding:10px 24px;border-radius:14px;box-shadow:0 4px 0 #16224a;margin:6px}
.box input,.box select{font:inherit;padding:9px 12px;border:3px solid #bcd7ff;border-radius:10px;margin:4px;width:200px;color:var(--ink)}
.sec{border:3px dashed #bcd7ff;border-radius:14px;padding:10px;margin:10px 0}
.er{color:#d33;min-height:22px;font-weight:700}
.code{font-size:64px;font-weight:900;letter-spacing:.2em;color:#3c63c4;margin:4px 0}
.pls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.pls span{background:#eef6ff;border-radius:12px;padding:6px 12px;font-weight:700}
#box.wide{width:min(780px,100%)}
.qc{border:3px solid #cfe0ff;border-radius:14px;padding:10px;margin:10px 0;text-align:left;background:#f7fbff}
.qc input,.qc textarea,.box input.wide{width:100%;margin:3px 0}
.qc textarea{font:inherit;padding:9px 12px;border:3px solid #bcd7ff;border-radius:10px;color:var(--ink);resize:vertical}
.qc small{opacity:.7;display:block}
.qh{display:flex;justify-content:space-between;align-items:center}
.tp{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border:3px solid #cfe0ff;border-radius:14px;padding:8px 12px;margin:8px 0;text-align:left}
.tp small{display:block;opacity:.7}
.box .btn.alt{background:#6b7aa8}.box .btn.sm{font-size:15px;padding:6px 14px;margin:3px}
.bar{position:sticky;bottom:-22px;background:#fff;padding:8px 0}
#skip{font-size:1.4cqw;padding:.8cqw 1.6cqw}
</style>
</head>
<body>
<div id="board" aria-label="Papan permainan Petualangan Matematika"></div>
<div id="ov"><div class="box" id="box"></div></div>
<script>
const $=s=>document.querySelector(s),F="⚀⚁⚂⚃⚄⚅";
const COL={start:"#ffe27a",q:"#cfe8ff",bon:"#ffd1e8",ch:"#d9c8ff",mis:"#ffd9a8",kt:"#ffbdbd",
PERPUSTAKAAN:"#e2d4ff",KANTIN:"#ffe0b8",LABORATORIUM:"#c4f1de",LAPANGAN:"#d3f5b5",KELAS:"#bde0fb","RUANG GURU":"#ffd3e4",KOPERASI:"#fff0b0",UKS:"#ffd0d0",TAMAN:"#c4f3d0","AULA SEKOLAH":"#ffe9a8"};
const rc=i=>i<=10?[11,11-i]:i<=20?[11-(i-10),1]:i<=30?[1,1+(i-20)]:[1+(i-30),11];
let S=null,me=JSON.parse(sessionStorage.me||'null'),es=null,tk=[],T=[];

const post=(p,b)=>fetch('/api/'+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})})
 .then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.err||'Terjadi kesalahan');return j});
const api=(p,b)=>post(p,{...me,...b}).catch(e=>alert(e.message));
const box=(h,w)=>{$('#box').className=w?'box wide':'box';$('#box').innerHTML=h;$('#ov').classList.add('on')};
const hide=()=>$('#ov').classList.remove('on');

/* ---- papan ---- */
function build(){const bd=$('#board');
T.forEach((t,i)=>{const d=document.createElement('div');d.className='t';const [r,c]=rc(i);d.style.gridArea=`${r}/${c}`;
d.style.background=t[0]=='loc'||t[0]=='cor'?COL[t[1]]:COL[t[0]];
d.innerHTML=`<i>${t[2]}</i><b>${t[1]}</b><div class="tk"></div>`;tk[i]=d.querySelector('.tk');bd.appendChild(d)});
const c=document.createElement('div');c.id='c';
c.innerHTML=`<div><h1>PETUALANGAN MATEMATIKA</h1><h2>KELILING BANGUN DATAR</h2></div>
<div class="stage"><span class="deco">📏</span><span>👦🏻</span><span>🧮</span><span>👧🏽</span><span class="deco">🔺</span><span>👦🏽</span><span>✏️</span><span>👧🏻</span><span class="deco">⬜</span></div>
<div class="goal"><b>Tujuan (C4):</b> menganalisis keliling bangun datar dengan mengenali sisi-sisi yang membatasinya, dan menjelaskan bahwa keliling adalah jumlah panjang seluruh sisi.</div>
<div id="score"></div><div id="msg"></div>
<div id="ctl"><div id="dice">🎲</div><button class="btn" id="roll" disabled>Lempar dadu</button><button class="btn" id="skip" style="display:none">Lewati giliran</button></div>`;
bd.appendChild(c);
$('#roll').onclick=()=>api('roll');
$('#skip').onclick=()=>confirm('Lewati giliran pemain ini?')&&api('skip')}

function fig(f){if(!f)return'';const L=(x,y,a,t)=>`<text x="${x}" y="${y}" text-anchor="${a}">${t}</text>`;let s='';
if(f[0]=='r')s=`<rect x="30" y="28" width="140" height="60" fill="#cfe8ff" stroke="#2b3a67" stroke-width="3"/>`+L(100,20,'middle',f[1])+L(24,62,'end',f[2]);
if(f[0]=='s')s=`<rect x="65" y="28" width="70" height="70" fill="#d3f5b5" stroke="#2b3a67" stroke-width="3"/>`+L(100,20,'middle',f[1]);
if(f[0]=='t')s=`<polygon points="100,12 175,95 25,95" fill="#ffe0b8" stroke="#2b3a67" stroke-width="3"/>`+L(52,45,'end',f[1])+L(148,45,'start',f[2])+L(100,112,'middle',f[3]);
return`<svg class="fg" viewBox="0 0 200 118" role="img" aria-label="Gambar bangun datar">${s}</svg>`}

/* ---- tampilan dari status server ---- */
function render(){if(!S)return;
tk.forEach(e=>e.innerHTML='');S.players.forEach(p=>tk[p.pos%40].innerHTML+=`<span>${p.ic}</span>`);
$('#score').innerHTML=S.players.map((p,i)=>`<div class="pl ${i==S.cur&&S.phase!='lobby'&&S.phase!='over'?'on':''}" style="${p.on?'':'opacity:.5'}">${p.ic} ${p.name}${i==S.me?' (kamu)':''}<small>${p.s} poin · putaran ${Math.min(S.laps,Math.floor(p.pos/40)+1)}/${S.laps}</small></div>`).join('');
const cp=S.players[S.cur],mine=S.me==S.cur&&S.me>=0;
$('#dice').textContent=S.dice?F[S.dice-1]:'🎲';
$('#msg').textContent=S.phase=='lobby'?'Menunggu permainan dimulai…':S.msg;
const rb=$('#roll');rb.disabled=!(S.phase=='roll'&&(mine||S.host));
rb.textContent=mine?'Lempar dadu':S.host&&cp?'Lempar untuk '+cp.name:cp&&S.phase!='lobby'?'Giliran '+cp.name:'Lempar dadu';
$('#skip').style.display=S.host&&['roll','question','feedback','card'].includes(S.phase)?'':'none';
modal()}

function modal(){const p=S.phase,cp=S.players[S.cur],mine=S.me==S.cur&&S.me>=0,can=mine||S.host;let h='';
const nx=can?'<button class="btn" id="nx">Lanjut</button>':'<i>Menunggu…</i>';
if(p=='lobby')h=`<div class="hd">🎒 Ruang tunggu</div><p>Buka <b>${location.host}</b> lalu masukkan kode:</p><div class="code">${S.code}</div>
<div class="pls">${S.players.map(x=>`<span>${x.ic} ${x.name}</span>`).join('')||'<i>Belum ada siswa yang masuk</i>'}</div><p>${S.players.length} pemain · ${S.laps} putaran · ${S.nq} soal</p>`+
(S.host?`<button class="btn" id="st"${S.players.length?'':' disabled'}>Mulai permainan</button>`:S.me>=0?'<p>Menunggu guru memulai…</p>':'');
else if(p=='question'||p=='feedback'){const q=S.q,f=S.fb;
h=`<div class="hd">${q.icon} ${q.title}</div><div class="pt">${cp.ic} ${cp.name} · benar +${q.pts}${q.pen?` · salah −${q.pen}`:''}</div><h3>${q.text}</h3>${fig(q.f)}
<div class="op">${q.opts.map((o,i)=>`<button data-i="${i}" class="${f?(i==f.right?'ok':i==f.pick?'no':''):''}" ${f||!mine?'disabled':''}>${o}</button>`).join('')}</div>`+
(f?`<div id="fb"><b>${f.ok?'🎉 Benar!':'Belum tepat.'}</b> ${f.e}<br><br>${nx}</div>`:`<div id="fb"><i>${mine?'Pilih jawabanmu!':'Menunggu '+cp.name+' menjawab…'}</i></div>`)}
else if(p=='card')h=`<div class="hd">${S.card.icon} ${S.card.title}</div><h3>${S.card.text}</h3>${nx}`;
else if(p=='over'){const r=[...S.players].sort((a,b)=>b.s-a.s),top=r[0].s;
h=`<div class="hd">🏆 Permainan selesai!</div><h3>${r.filter(x=>x.s==top).map(x=>x.ic+' '+x.name).join(' & ')} menang!</h3>
<div style="text-align:left;font-size:18px;line-height:1.8">${r.map((x,i)=>`${i+1}. ${x.ic} ${x.name} — <b>${x.s} poin</b>`).join('<br>')}</div>
<p style="font-size:15px">Ingat: keliling adalah jumlah panjang seluruh sisi bangun datar.</p>${S.host?'<button class="btn" id="rs">Main lagi (kode sama)</button>':''}<button class="btn" id="out" style="background:#6b7aa8">Keluar</button>`}
else return hide();
box(h);
$('#st')&&($('#st').onclick=()=>api('start'));$('#nx')&&($('#nx').onclick=()=>api('next'));
$('#rs')&&($('#rs').onclick=()=>api('restart'));$('#out')&&($('#out').onclick=()=>home());
document.querySelectorAll('.op button').forEach(b=>b.onclick=()=>api('answer',{i:+b.dataset.i}))}

/* ---- masuk, panel guru, editor materi ---- */
let PINREQ=false,pin=sessionStorage.pin||'',ED=null,LAPS=2;
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const dec=s=>String(s||'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
const tpost=(p,b)=>post(p,{pin,...b});
const blank=()=>({q:'',c:'',w:['','',''],e:'',ft:'',fl:''});
const fromApi=x=>({q:dec(x.q),c:dec(x.o[0]),w:[1,2,3].map(i=>dec(x.o[i]||'')),e:dec(x.e),ft:x.f?x.f[0]:'',fl:x.f?x.f.slice(1).map(dec).join(', '):''});
const toApi=x=>({q:x.q,o:[x.c,...x.w],e:x.e,f:x.ft?[x.ft,...x.fl.split(',').map(v=>v.trim())]:undefined});

function home(err){es&&es.close();es=null;S=null;me=null;sessionStorage.removeItem('me');
box(`<div class="hd">🎒 Petualangan Matematika</div><p>Keliling Bangun Datar · Kelas 5</p>
<div class="sec"><b>Siswa</b><br><input id="kd" inputmode="numeric" maxlength="4" placeholder="Kode bermain"><br><input id="nm" maxlength="14" placeholder="Nama kamu"><br><button class="btn" id="jn">Masuk</button></div>
<div class="sec"><b>Guru</b><br>${PINREQ?`<input id="pn" type="password" placeholder="PIN guru" value="${esc(pin)}"><br>`:''}<button class="btn" id="gr">Buka panel guru</button></div>
<div class="er" id="er">${err||''}</div>`);
$('#jn').onclick=()=>go('join',{code:$('#kd').value.trim(),name:$('#nm').value});
$('#gr').onclick=()=>{pin=$('#pn')?$('#pn').value:'';sessionStorage.pin=pin;teacher()}}

async function teacher(msg){try{const L=await tpost('tpl/list');
box(`<div class="hd">👩‍🏫 Panel guru</div><p>Pilih materi untuk membuat room, atau buat materi sendiri.</p>
<div>Jumlah putaran <select id="lp" style="width:80px">${[1,2,3].map(n=>`<option ${n==LAPS?'selected':''}>${n}</option>`).join('')}</select></div>
${L.map(t=>`<div class="tp"><div><b>${esc(t.name)}</b><small>${t.n} soal</small></div><div>
<button class="btn sm" data-a="use" data-id="${t.id}">Buat room</button><button class="btn sm alt" data-a="edit" data-id="${t.id}">${t.id=='default'?'Salin &amp; edit':'Edit'}</button>${t.id!='default'?`<button class="btn sm alt" data-a="del" data-id="${t.id}">Hapus</button>`:''}</div></div>`).join('')}
<button class="btn" id="nw">+ Materi baru</button><button class="btn alt" id="bk">Kembali</button><div class="er" id="er">${msg||''}</div>`,true);
$('#lp').onchange=e=>LAPS=+e.target.value;$('#bk').onclick=()=>home();
$('#nw').onclick=()=>{ED={id:null,name:'',qs:[blank(),blank(),blank()]};editor()};
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{const id=b.dataset.id,a=b.dataset.a;
 try{if(a=='del'){if(confirm('Hapus materi ini?')){await tpost('tpl/del',{id});teacher()}return}
 const t=await tpost('tpl/get',{id});
 if(a=='use')return go('create',{laps:LAPS,qs:t.qs});
 ED={id:id=='default'?null:id,name:id=='default'?'Salinan '+t.name:t.name,qs:t.qs.map(fromApi)};editor()}catch(e){$('#er').textContent=e.message}})
}catch(e){home(e.message)}}

function editor(pos){const st=$('#box').scrollTop;
box(`<div class="hd">✏️ Editor materi</div><input id="nm2" class="wide" placeholder="Nama materi (mis. Keliling Bangun Datar)" value="${esc(ED.name)}">
${ED.qs.map((x,i)=>`<div class="qc"><div class="qh"><b>Soal ${i+1}</b><button class="btn sm alt" data-d="${i}">Hapus</button></div>
<textarea data-i="${i}" data-k="q" rows="2" placeholder="Pertanyaan">${esc(x.q)}</textarea>
<input data-i="${i}" data-k="c" placeholder="✅ Jawaban benar" value="${esc(x.c)}">
${[0,1,2].map(j=>`<input data-i="${i}" data-k="w${j}" placeholder="❌ Pilihan salah ${j+1}${j?' (opsional)':''}" value="${esc(x.w[j])}">`).join('')}
<input data-i="${i}" data-k="e" class="wide" placeholder="Pembahasan (opsional)" value="${esc(x.e)}">
<div>Gambar <select data-i="${i}" data-k="ft">${[['','Tanpa gambar'],['s','Persegi'],['r','Persegi panjang'],['t','Segitiga']].map(([v,l])=>`<option value="${v}" ${x.ft==v?'selected':''}>${l}</option>`).join('')}</select>
<input data-i="${i}" data-k="fl" placeholder="Label sisi, mis. 12 cm, 5 cm" value="${esc(x.fl)}"><small>Persegi: 1 label · persegi panjang: 2 label (panjang, lebar) · segitiga: 3 label (pakai "?" untuk sisi yang dicari)</small></div></div>`).join('')}
<button class="btn alt" id="ad">+ Tambah soal</button><div class="er" id="er"></div>
<div class="bar"><button class="btn" id="sv">💾 Simpan materi</button><button class="btn" id="mr">▶ Buat room</button><button class="btn alt" id="bk">Kembali</button></div>`,true);
$('#box').scrollTop=pos=='end'?1e6:st;
$('#box').oninput=e=>{const t=e.target,k=t.dataset.k;if(t.id=='nm2')ED.name=t.value;if(!k)return;const q=ED.qs[+t.dataset.i];k[0]=='w'?q.w[+k[1]]=t.value:q[k]=t.value};
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{ED.qs.splice(+b.dataset.d,1);editor()});
$('#ad').onclick=()=>{ED.qs.push(blank());editor('end')};
$('#bk').onclick=()=>teacher();
const chk=()=>{if(ED.qs.length<3)return'Minimal 3 soal';for(let i=0;i<ED.qs.length;i++){const x=ED.qs[i];if(!x.q.trim()||!x.c.trim()||!x.w.some(w=>w.trim()))return`Soal ${i+1}: isi pertanyaan, jawaban benar, dan minimal 1 pilihan salah`}return''};
$('#sv').onclick=async()=>{const m=chk();if(m)return $('#er').textContent=m;
 try{const r=await tpost('tpl/save',{id:ED.id,name:ED.name,qs:ED.qs.map(toApi)});ED.id=r.id;$('#er').style.color='#1a8f4c';$('#er').textContent='Materi tersimpan ✓'}catch(e){$('#er').textContent=e.message}};
$('#mr').onclick=()=>{const m=chk();if(m)return $('#er').textContent=m;go('create',{laps:LAPS,qs:ED.qs.map(toApi)})}}

async function go(p,b){try{const r=await post(p,{pin,...b});me={code:r.code,pid:r.pid,hid:r.hid};sessionStorage.me=JSON.stringify(me);connect()}catch(e){$('#er')?$('#er').textContent=e.message:alert(e.message)}}

function connect(){es&&es.close();es=new EventSource(`/events?code=${me.code}&pid=${me.pid||''}&hid=${me.hid||''}`);
es.onmessage=e=>{S=JSON.parse(e.data);render()};
es.onerror=()=>{if(es.readyState==2)home('Permainan tidak ditemukan atau sudah berakhir.')}}
